<!doctype html>
<html lang="en" data-theme="casual">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script>
      // Opened from an NFC tag or QR code: hide the card until the tap
      // sequence can play it in. Fail open after 3s if JS never arrives.
      (function () {
        if (!/[?&]via=(nfc|tap|qr|link)\b/.test(location.search)) return;
        var root = document.documentElement;
        root.classList.add('arrive');
        setTimeout(function () {
          if (!root.classList.contains('arriving')) root.classList.remove('arrive');
        }, 3000);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
